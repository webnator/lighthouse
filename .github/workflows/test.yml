name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --html examples/page.html --artifacts artifacts --min-score 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit
          path: artifacts/
